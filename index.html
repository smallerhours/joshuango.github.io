<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Smaller Hours — a photography portfolio of fashion, spaces, and quiet observation.">
  <meta property="og:title" content="Smaller Hours">
  <meta property="og:description" content="Photography of fashion, spaces, and quiet observation.">
  <meta property="og:type" content="website">
  <title>Smaller Hours</title>
  <link rel="stylesheet" href="style.css?v=35">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="scroll-progress" aria-hidden="true"></div>

  <header class="site-header" id="siteHeader">
    <a class="wordmark" href="#welcome" aria-label="Smaller Hours, home"><span>Smaller</span><span>Hours</span></a>
    <p class="header-note" aria-label="Visitor local time"><span id="localTime"></span></p>
    <button class="menu-button" id="menuButton" type="button" aria-expanded="false" aria-controls="sideMenu" aria-label="Open menu">
      <span></span><span></span>
    </button>
  </header>

  <div class="menu-backdrop" id="menuBackdrop" aria-hidden="true"></div>
  <aside class="side-menu" id="sideMenu" aria-hidden="true" aria-label="Site menu">
    <header class="menu-header">
      <button class="menu-close" id="menuClose" type="button" aria-label="Close menu">Close</button>
    </header>
    <nav class="menu-nav" aria-label="Menu navigation">
      <a href="study.html"><span>01</span>Work</a>
      <a href="about.html"><span>02</span>About</a>
    </nav>
    <footer class="menu-footer">
      <img class="instagram-mark" src="images/instagram.svg" alt="Instagram">
    </footer>
  </aside>

  <main id="content">
    <!-- HOME_LATEST_START -->
    <section class="portfolio-feature" id="welcome" aria-labelledby="welcome-title">
      <a class="portfolio-feature-link reveal-visual" href="amomento-fw26-the-tailors-room.html" aria-label="View AMOMENTO FW26: The Tailor’s Room">
        <img src="images/amomento-fw26-look-01.webp" alt="Model in a belted brown jacket and hood walking through the AMOMENTO FW26 presentation">
        <span class="portfolio-feature-shade" aria-hidden="true"></span>
        <span class="portfolio-feature-label">Selected work / 02</span>
        <h1 id="welcome-title">AMOMENTO FW26: The Tailor’s Room</h1>
        <span class="portfolio-feature-category">Fashion</span>
      </a>
    </section>
    <!-- HOME_LATEST_END -->

    <!-- HOME_ARCHIVE_START -->
    <section class="portfolio-index" id="recent" aria-labelledby="recent-title">
      <header class="portfolio-index-header reveal">
        <h2 id="recent-title">Selected work</h2>
        <a href="study.html">View all projects</a>
      </header>
      <div class="portfolio-grid" aria-label="Photography portfolio">
        <figure class="portfolio-tile portfolio-tile-0 reveal" style="--delay: 0ms">
          <a href="amomento-fw26-the-tailors-room.html" aria-label="View AMOMENTO FW26: The Tailor’s Room">
            <img src="images/amomento-fw26-look-07.webp" alt="Model in a long olive coat with a softly wrapped white shirt">
          </a>
          <figcaption><span>AMOMENTO FW26: The Tailor’s Room</span><span>01</span></figcaption>
        </figure>
        <figure class="portfolio-tile portfolio-tile-1 reveal" style="--delay: 55ms">
          <a href="amomento-fw26-the-tailors-room.html" aria-label="View AMOMENTO FW26: The Tailor’s Room">
            <img src="images/amomento-fw26-look-15.webp" alt="Model in a white shirt, charcoal bodice, full trousers, and leather gloves">
          </a>
          <figcaption><span>AMOMENTO FW26: The Tailor’s Room</span><span>02</span></figcaption>
        </figure>
        <figure class="portfolio-tile portfolio-tile-2 reveal" style="--delay: 110ms">
          <a href="amomento-fw26-the-tailors-room.html" aria-label="View AMOMENTO FW26: The Tailor’s Room">
            <img src="images/amomento-fw26-look-25.webp" alt="Model in an olive tailored jacket, dark shirt and tie, and wide black trousers">
          </a>
          <figcaption><span>AMOMENTO FW26: The Tailor’s Room</span><span>03</span></figcaption>
        </figure>
        <figure class="portfolio-tile portfolio-tile-3 reveal" style="--delay: 0ms">
          <a href="final-chapter-of-uniqlo-u.html" aria-label="View The Final Chapter of Uniqlo U">
            <img src="images/uniqlo-u-fw26-portrait.webp" alt="Full-length view of the dark tailored look">
          </a>
          <figcaption><span>The Final Chapter of Uniqlo U</span><span>04</span></figcaption>
        </figure>
      </div>
    </section>
    <!-- HOME_ARCHIVE_END -->
  </main>

  <footer class="site-footer">
    <p class="footer-brand">Smaller Hours<sup>©</sup></p>
  </footer>

  <a class="floating-top" id="floatingTop" href="#welcome" aria-label="Back to top"><span aria-hidden="true">↑</span></a>

  <script>
    const root = document.documentElement;
    const header = document.getElementById('siteHeader');
    const menuButton = document.getElementById('menuButton');
    const menuClose = document.getElementById('menuClose');
    const menuBackdrop = document.getElementById('menuBackdrop');
    const sideMenu = document.getElementById('sideMenu');
    const floatingTop = document.getElementById('floatingTop');
    const localTime = document.getElementById('localTime');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let ticking = false;

    function setMenu(open) {
      document.body.classList.toggle('menu-open', open);
      menuButton.setAttribute('aria-expanded', String(open));
      menuButton.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      sideMenu.setAttribute('aria-hidden', String(!open));
      menuBackdrop.setAttribute('aria-hidden', String(!open));
      if (open) menuClose.focus();
      else if (document.activeElement === menuClose) menuButton.focus();
    }

    menuButton.addEventListener('click', () => setMenu(menuButton.getAttribute('aria-expanded') !== 'true'));
    menuClose.addEventListener('click', () => setMenu(false));
    menuBackdrop.addEventListener('click', () => setMenu(false));
    sideMenu.querySelectorAll('a').forEach((link) => link.addEventListener('click', () => setMenu(false)));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && menuButton.getAttribute('aria-expanded') === 'true') setMenu(false);
    });

    function updateLocalDateTime() {
      const now = new Date();
      localTime.textContent = new Intl.DateTimeFormat(undefined, {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      }).format(now);
    }

    updateLocalDateTime();
    window.setInterval(updateLocalDateTime, 1000);

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });

    document.querySelectorAll('.reveal, .reveal-visual').forEach((item) => revealObserver.observe(item));

    function updateScroll() {
      const y = window.scrollY;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      root.style.setProperty('--progress', max > 0 ? y / max : 0);
      header.classList.toggle('is-compact', y > 40);
      floatingTop.classList.toggle('is-visible', y > window.innerHeight * 0.55);

      if (!reducedMotion) {
        document.querySelectorAll('[data-depth]').forEach((item) => {
          const speed = Number(item.dataset.depth);
          const rect = item.parentElement.getBoundingClientRect();
          const offset = (rect.top + rect.height / 2 - window.innerHeight / 2) * speed;
          item.style.setProperty('--depth', offset + 'px');
        });
      }

      ticking = false;
    }

    window.addEventListener('scroll', () => {
      if (!ticking) {
        requestAnimationFrame(updateScroll);
        ticking = true;
      }
    }, { passive: true });

    updateScroll();
  </script>
</body>
</html>
