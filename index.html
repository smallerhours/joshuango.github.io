<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Joshua Ngo — photography portfolio.">
  <meta property="og:title" content="Joshua Ngo — Photographer">
  <meta property="og:description" content="Photography of fashion, spaces, and quiet observation.">
  <meta property="og:type" content="website">
  <title>Joshua Ngo — Photographer</title>
  <meta property="og:image" content="https://smallerhours.github.io/joshuango.github.io/images/home/japandi-01.jpg">
  <link rel="stylesheet" href="style.css?v=37">
</head>
<body class="home-page">
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="scroll-progress" aria-hidden="true"></div>

  <header class="site-header" id="siteHeader">
    <a class="wordmark" href="#welcome" aria-label="Joshua Ngo, home"><span>Joshua</span><span>Ngo</span></a>
    <p class="header-note" aria-label="Visitor local time"><span id="localTime"></span></p>
    <button class="menu-button" id="menuButton" type="button" aria-expanded="false" aria-controls="sideMenu" aria-label="Open menu">
      <span></span><span></span>
    </button>
  </header>

  <div class="menu-backdrop" id="menuBackdrop" aria-hidden="true"></div>
  <aside class="side-menu" id="sideMenu" aria-hidden="true" aria-label="Site menu">
    <header class="menu-header">
      <button class="menu-close" id="menuClose" type="button" aria-label="Close menu">Close</button>
    </header>
    <nav class="menu-nav" aria-label="Menu navigation">
      <a href="study.html"><span>01</span>Work</a>
      <a href="about.html"><span>02</span>About</a>
    </nav>
    <footer class="menu-footer">
      <img class="instagram-mark" src="images/instagram.svg" alt="Instagram">
    </footer>
  </aside>

  <main id="content">
    <!-- HOME_LATEST_START -->
    <section class="home-slideshow" id="welcome" aria-label="Featured photography slideshow">
      <div class="home-slides" data-slideshow>
        <figure class="home-slide is-active" aria-hidden="false">
          <img src="images/home/japandi-01.jpg" alt="A quiet Japanese room with tatami, timber, and soft natural light" fetchpriority="high">
          <figcaption><a href="https://www.pexels.com/photo/room-in-a-traditional-japanese-house-20025763/" target="_blank" rel="noopener noreferrer">Bruno Makori / Pexels</a></figcaption>
        </figure>
        <figure class="home-slide" aria-hidden="true">
          <img src="images/home/japandi-02.jpg" alt="A warm Japandi living room with textured walls and a pale sofa" loading="lazy">
          <figcaption><a href="https://www.pexels.com/photo/cozy-japandi-living-room-with-modern-design-29383009/" target="_blank" rel="noopener noreferrer">Pavel Morillo / Pexels</a></figcaption>
        </figure>
        <figure class="home-slide" aria-hidden="true">
          <img src="images/home/japandi-03.jpg" alt="A minimal interior with wooden beams and low furniture" loading="lazy">
          <figcaption><a href="https://www.pexels.com/photo/a-room-with-minimalist-interior-10421514/" target="_blank" rel="noopener noreferrer">Junseob Yoon / Pexels</a></figcaption>
        </figure>
      </div>
      <button class="home-slide-next" id="homeSlideNext" type="button" aria-label="Show next image"></button>
      <div class="home-slide-ui" aria-hidden="true">
        <span>Joshua Ngo / Photography</span>
        <span class="home-slide-counter"><span id="homeSlideCurrent">01</span> / 03</span>
      </div>
    </section>
    <!-- HOME_LATEST_END -->

    <!-- HOME_ARCHIVE_START -->

    <!-- HOME_ARCHIVE_END -->
  </main>

  <footer class="site-footer">
    <p class="footer-brand">© 2026 Joshua Ngo</p>
  </footer>

  <a class="floating-top" id="floatingTop" href="#welcome" aria-label="Back to top"><span aria-hidden="true">↑</span></a>

  <script>
    const root = document.documentElement;
    const header = document.getElementById('siteHeader');
    const menuButton = document.getElementById('menuButton');
    const menuClose = document.getElementById('menuClose');
    const menuBackdrop = document.getElementById('menuBackdrop');
    const sideMenu = document.getElementById('sideMenu');
    const floatingTop = document.getElementById('floatingTop');
    const localTime = document.getElementById('localTime');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let ticking = false;

    function setMenu(open) {
      document.body.classList.toggle('menu-open', open);
      menuButton.setAttribute('aria-expanded', String(open));
      menuButton.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      sideMenu.setAttribute('aria-hidden', String(!open));
      menuBackdrop.setAttribute('aria-hidden', String(!open));
      if (open) menuClose.focus();
      else if (document.activeElement === menuClose) menuButton.focus();
    }

    menuButton.addEventListener('click', () => setMenu(menuButton.getAttribute('aria-expanded') !== 'true'));
    menuClose.addEventListener('click', () => setMenu(false));
    menuBackdrop.addEventListener('click', () => setMenu(false));
    sideMenu.querySelectorAll('a').forEach((link) => link.addEventListener('click', () => setMenu(false)));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && menuButton.getAttribute('aria-expanded') === 'true') setMenu(false);
    });

    function updateLocalDateTime() {
      const now = new Date();
      localTime.textContent = new Intl.DateTimeFormat(undefined, {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      }).format(now);
    }

    updateLocalDateTime();
    window.setInterval(updateLocalDateTime, 1000);

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });

    document.querySelectorAll('.reveal, .reveal-visual').forEach((item) => revealObserver.observe(item));

    function updateScroll() {
      const y = window.scrollY;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      root.style.setProperty('--progress', max > 0 ? y / max : 0);
      header.classList.toggle('is-compact', y > 40);
      floatingTop.classList.toggle('is-visible', y > window.innerHeight * 0.55);

      if (!reducedMotion) {
        document.querySelectorAll('[data-depth]').forEach((item) => {
          const speed = Number(item.dataset.depth);
          const rect = item.parentElement.getBoundingClientRect();
          const offset = (rect.top + rect.height / 2 - window.innerHeight / 2) * speed;
          item.style.setProperty('--depth', offset + 'px');
        });
      }

      ticking = false;
    }

    window.addEventListener('scroll', () => {
      if (!ticking) {
        requestAnimationFrame(updateScroll);
        ticking = true;
      }
    }, { passive: true });

    updateScroll();

    const slides = Array.from(document.querySelectorAll('.home-slide'));
    const slideCurrent = document.getElementById('homeSlideCurrent');
    const slideNext = document.getElementById('homeSlideNext');
    let activeSlide = 0;
    let slideTimer;

    function showSlide(index) {
      if (slides.length < 2) return;
      slides[activeSlide].classList.remove('is-active');
      slides[activeSlide].setAttribute('aria-hidden', 'true');
      activeSlide = (index + slides.length) % slides.length;
      slides[activeSlide].classList.add('is-active');
      slides[activeSlide].setAttribute('aria-hidden', 'false');
      slideCurrent.textContent = String(activeSlide + 1).padStart(2, '0');
    }

    function restartSlideshow() {
      window.clearInterval(slideTimer);
      if (!reducedMotion && slides.length > 1 && !document.hidden) {
        slideTimer = window.setInterval(() => showSlide(activeSlide + 1), 6500);
      }
    }

    slideNext?.addEventListener('click', () => {
      showSlide(activeSlide + 1);
      restartSlideshow();
    });
    document.addEventListener('visibilitychange', restartSlideshow);
    restartSlideshow();
  </script>
</body>
</html>
