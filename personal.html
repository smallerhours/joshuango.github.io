<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal photography by Joshua Ngo.">
  <meta property="og:title" content="Personal — Joshua Ngo">
  <meta property="og:description" content="Personal observations of architecture, space, and place.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://smallerhours.github.io/joshuango.github.io/images/portfolio/museum-san.jpg">
  <title>Personal — Joshua Ngo</title>
  <link rel="stylesheet" href="style.css?v=38">
</head>
<body class="personal-page">
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="scroll-progress" aria-hidden="true"></div>

  <header class="site-header" id="siteHeader">
    <a class="wordmark" href="index.html" aria-label="Joshua Ngo, home"><span>Joshua</span><span>Ngo</span></a>
    <p class="header-note" aria-label="Visitor local time"><span id="localTime"></span></p>
    <button class="menu-button" id="menuButton" type="button" aria-expanded="false" aria-controls="sideMenu" aria-label="Open menu"><span></span><span></span></button>
  </header>

  <div class="menu-backdrop" id="menuBackdrop" aria-hidden="true"></div>
  <aside class="side-menu" id="sideMenu" aria-hidden="true" aria-label="Site menu">
    <header class="menu-header"><button class="menu-close" id="menuClose" type="button" aria-label="Close menu">Close</button></header>
    <nav class="menu-nav" aria-label="Menu navigation">
      <div class="menu-group">
        <p class="menu-group-title"><span>01</span>Portfolio</p>
        <div class="menu-subnav"><a href="personal.html" aria-current="page">Personal</a><a href="study.html">Work</a></div>
      </div>
      <a class="menu-primary" href="about.html"><span>02</span>About</a>
    </nav>
    <footer class="menu-footer"><img class="instagram-mark" src="images/instagram.svg" alt="Instagram"></footer>
  </aside>

  <main class="personal-main" id="content">
    <header class="personal-intro">
      <p>Portfolio / Personal</p>
      <h1>Personal</h1>
      <p>Observations of architecture, space, and place.</p>
    </header>

    <section class="personal-grid" aria-label="Personal photography">
      <figure class="personal-image personal-image-wide reveal"><img src="images/portfolio/bar-8.jpg" alt="A softly lit bar interior with a mirrored ceiling"><figcaption><span>Bar 8</span><span>01</span></figcaption></figure>
      <figure class="personal-image personal-image-left reveal"><img src="images/portfolio/museum-san.jpg" alt="Stone walls and trees seen through the tall windows of Museum SAN" loading="lazy"><figcaption><span>Museum SAN</span><span>02</span></figcaption></figure>
      <figure class="personal-image personal-image-right reveal"><img src="images/portfolio/concrete-wall.jpg" alt="A concrete terrace framed by a mountain landscape" loading="lazy"><figcaption><span>Concrete Wall</span><span>03</span></figcaption></figure>
      <figure class="personal-image personal-image-wide reveal"><img src="images/portfolio/songdo.jpg" alt="Songdo skyline reflected in a park lake" loading="lazy"><figcaption><span>Songdo</span><span>04</span></figcaption></figure>
      <figure class="personal-image personal-image-left reveal"><img src="images/portfolio/yongsan-01.jpg" alt="A colonnade opening onto a green garden in Yongsan" loading="lazy"><figcaption><span>Yongsan</span><span>05</span></figcaption></figure>
      <figure class="personal-image personal-image-right reveal"><img src="images/portfolio/yongsan-02.jpg" alt="A symmetrical stone memorial passage in Yongsan" loading="lazy"><figcaption><span>Yongsan</span><span>06</span></figcaption></figure>
      <figure class="personal-image personal-image-portrait reveal"><img src="images/portfolio/yongsan-03.jpg" alt="A solitary figure crossing a monumental stone interior" loading="lazy"><figcaption><span>Yongsan</span><span>07</span></figcaption></figure>
    </section>
  </main>

  <footer class="site-footer"><p class="footer-brand">© 2026 Joshua Ngo</p></footer>
  <a class="floating-top" id="floatingTop" href="#content" aria-label="Back to top"><span aria-hidden="true">↑</span></a>

  <script>
    const root = document.documentElement;
    const header = document.getElementById('siteHeader');
    const menuButton = document.getElementById('menuButton');
    const menuClose = document.getElementById('menuClose');
    const menuBackdrop = document.getElementById('menuBackdrop');
    const sideMenu = document.getElementById('sideMenu');
    const floatingTop = document.getElementById('floatingTop');
    const localTime = document.getElementById('localTime');
    let ticking = false;

    function setMenu(open) {
      document.body.classList.toggle('menu-open', open);
      menuButton.setAttribute('aria-expanded', String(open));
      menuButton.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      sideMenu.setAttribute('aria-hidden', String(!open));
      menuBackdrop.setAttribute('aria-hidden', String(!open));
      if (open) menuClose.focus();
      else if (document.activeElement === menuClose) menuButton.focus();
    }

    function updateLocalDateTime() {
      localTime.textContent = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date());
    }

    function updateScroll() {
      const y = window.scrollY;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      root.style.setProperty('--progress', max > 0 ? y / max : 0);
      header.classList.toggle('is-compact', y > 40);
      floatingTop.classList.toggle('is-visible', y > window.innerHeight * .55);
      ticking = false;
    }

    menuButton.addEventListener('click', () => setMenu(menuButton.getAttribute('aria-expanded') !== 'true'));
    menuClose.addEventListener('click', () => setMenu(false));
    menuBackdrop.addEventListener('click', () => setMenu(false));
    sideMenu.querySelectorAll('a').forEach((link) => link.addEventListener('click', () => setMenu(false)));
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') setMenu(false); });
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: .08, rootMargin: '0px 0px -8% 0px' });
    document.querySelectorAll('.reveal').forEach((item) => revealObserver.observe(item));
    window.addEventListener('scroll', () => {
      if (!ticking) { requestAnimationFrame(updateScroll); ticking = true; }
    }, { passive: true });
    updateLocalDateTime();
    window.setInterval(updateLocalDateTime, 1000);
    updateScroll();
  </script>
</body>
</html>
